apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mytodo
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/suman023/mytodo-k8s-manifests   # <-- apna repo URL
    targetRevision: main
    path: .

  destination:
    server: https://kubernetes.default.svc
    namespace: mytodo

  syncPolicy:
    automated:
      prune: true       
      selfHeal: true    
    syncOptions:
    - CreateNamespace=true
    - ApplyOutOfSyncOnly=true
